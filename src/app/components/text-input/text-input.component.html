<label for="text-input" class="visually-hidden">Enter your text</label>
<textarea
  id="text-input"
  placeholder="Start typing here… (or paste your text)"
  aria-describedby="limit-warning"
  [value]="text"
  [attr.aria-invalid]="isOverLimit"
  (input)="onInput($event)"
></textarea>

<p
  class="limit-warning"
  id="limit-warning"
  aria-live="polite"
  aria-atomic="true"
  [hidden]="!isOverLimit"
>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <circle cx="7" cy="7" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2" />
    <path d="M7 6.3v3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="7" cy="4.4" r=".75" fill="currentColor" />
  </svg>
  <span>{{ warningMessage }}</span>
</p>
